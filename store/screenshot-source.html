<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store frame</title>
    <style>
      :root {
        --bg: #010409;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --accent: #4493f8;
        --line: #3d444d;
        --glow: rgb(31 111 235 / 30%);
      }
      :root[data-theme="light"] {
        --bg: #f6f8fa;
        --fg: #1f2328;
        --muted: #59636e;
        --accent: #0969da;
        --line: #d1d9e0;
        --glow: rgb(9 105 218 / 14%);
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
        color: var(--fg);
        background: radial-gradient(circle at 88% 12%, var(--glow), transparent 46%), var(--bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 72px;
        padding: 0 96px 0 104px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 17px;
        font-weight: 600;
      }
      .brand img {
        width: 40px;
        height: 40px;
      }
      h1 {
        margin: 40px 0 0;
        font-size: 50px;
        line-height: 1.06;
        letter-spacing: -1.4px;
        font-weight: 700;
        text-wrap: balance;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        margin: 22px 0 0;
        max-width: 470px;
        color: var(--muted);
        font-size: 20px;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .shot {
        display: block;
        height: 680px;
        border-radius: 14px;
        border: 1px solid var(--line);
        box-shadow:
          0 24px 60px rgb(1 4 9 / 28%),
          0 2px 6px rgb(1 4 9 / 12%);
      }
    </style>
  </head>
  <body>
    <div>
      <div class="brand"><img src="../icons/icon128.png" alt="" />GitHub PR Tracker</div>
      <h1 id="h"></h1>
      <p id="p"></p>
    </div>
    <img class="shot" id="shot" alt="" />
    <script>
      const q = new URLSearchParams(location.search)
      document.documentElement.dataset.theme = q.get("theme")
      document.getElementById("h").innerHTML = q.get("h")
      document.getElementById("p").textContent = q.get("p")
      document.getElementById("shot").src = q.get("img")
    </script>
  </body>
</html>
