name: Marketplace release

on:
  pull_request:
    paths:
      - ".changeset/**"
      - ".github/workflows/marketplace-release.yml"
      - ".github/workflows/release.yml"
      - "icons/**"
      - "scripts/package-extension.ts"
      - "scripts/sync-manifest-version.ts"
      - "scripts/validate-marketplace.ts"
      - "src/**"
      - "store/**"
      - "bun.lock"
      - "manifest.json"
      - "package.json"
      - "vite.config.ts"
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate Chrome Web Store release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run project gate
        run: bun run gate

      - name: Build Chrome Web Store ZIP
        run: bun run package:extension

      - name: Validate package and listing images
        run: bun run validate:marketplace

      - name: Upload marketplace release bundle
        uses: actions/upload-artifact@v7
        with:
          name: github-pr-tracker-marketplace-${{ github.sha }}
          path: |
            release/github-pr-tracker-*.zip
            store/assets/*.png
          if-no-files-found: error
          retention-days: 30
